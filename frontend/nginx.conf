# ⚠️  THIS IS THE FLY.IO CONTAINER CONFIG — NOT THE VPS CONFIG.
#
# For the VPS deployment use ops/nginx/scholarships.conf instead. The two are
# NOT interchangeable, and mixing them up breaks the scholarship API:
#
#   This file proxies /api/ to a SEPARATE host and STRIPS the /api prefix
#   (note the trailing slash on proxy_pass). Under that rule a request for
#   /api/scholarships arrives at the backend as /scholarships — which does not
#   exist. The scholarship API is mounted AT /api on the same origin.
#
# If you keep deploying the frontend to fly.io, either:
#   (a) point the SPA at the API host directly via VITE_PUBLIC_API_BASE_URL, or
#   (b) drop the trailing slash on proxy_pass below so the prefix is preserved.
#
# The VPS config (ops/nginx/scholarships.conf) has neither problem: it serves
# the SPA and the API from one origin, which is also what the paywall cookie
# needs.

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy all /api/ calls to the backend (strips /api prefix)
    location /api/ {
        proxy_pass https://api.neithlogic.com/;
        proxy_http_version 1.1;
        proxy_set_header Host api.neithlogic.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_ssl_server_name on;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
}
