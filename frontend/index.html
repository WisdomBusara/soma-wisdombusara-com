<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      This is a public, shareable site. The metadata below is what a customer
      sees in their browser tab, in Google results, and — critically for the
      funnel — in the preview card when a link is shared on WhatsApp.
      The admin app is served from the same bundle but is not the public face,
      so the title reflects the scholarship site, not "Wraith Admin".

      Before launch, replace the two commented absolute URLs (og:url, og:image)
      with your real domain and an OG image. Everything else is domain-agnostic.
    -->
    <title>Fully Funded Scholarships, Straight From the Source</title>
    <meta
      name="description"
      content="The scholarships that fund you rarely make the listicles. We read university funding pages and PDFs every night, pull out the funding, eligibility and deadline, and link the source every time. Free to search."
    />
    <meta name="theme-color" content="#faf9f6" />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <!-- Open Graph / social share -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Scholarship Engine" />
    <meta property="og:title" content="Fully Funded Scholarships, Straight From the Source" />
    <meta
      property="og:description"
      content="University scholarships and funding, read nightly from the source and delivered with the deadline, eligibility and how to apply. Free to search."
    />
    <!-- <meta property="og:url" content="https://soma.wisdombusara.com/" /> -->
    <!-- <meta property="og:image" content="https://soma.wisdombusara.com/og.png" /> -->

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Fully Funded Scholarships, Straight From the Source" />
    <meta
      name="twitter:description"
      content="University scholarships and funding, read nightly from the source. Free to search."
    />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
