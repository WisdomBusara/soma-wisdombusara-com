# /etc/nginx/sites-available/scholarships
#
# Serves the built SPA and proxies the API to the Node process.
#
# Two things here are load-bearing and easy to get wrong:
#
#   1. `try_files … /index.html` — the site is a client-side router. Without
#      this, a visitor who lands directly on /scholarships/abc123 (which is
#      exactly what a Google result or a shared WhatsApp link does) gets a 404.
#
#   2. index.html must NOT be cached. Hashed assets are immutable and cached for
#      a year; index.html points at them and changes every deploy. Cache it and
#      readers keep loading yesterday's bundle after you ship.
#
# Install:
#   sudo cp nginx/scholarships.conf /etc/nginx/sites-available/scholarships
#   sudo ln -s /etc/nginx/sites-available/scholarships /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d scholarships.neithlogic.com

upstream wraith_api {
    server 127.0.0.1:8080;
    keepalive 32;
}

# Rate limit zones. Checkout is stricter because each request can start a
# real M-Pesa charge.
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=pay_zone:10m rate=1r/s;

server {
    listen 80;
    listen [::]:80;
    server_name scholarships.neithlogic.com;

    # ── Before you run Certbot ────────────────────────────────────────────────
    # This block serves the site over plain HTTP so nginx starts cleanly on a
    # fresh box. `sudo certbot --nginx -d <domain>` will:
    #   • add a `listen 443 ssl` server block with your certificate paths, and
    #   • rewrite this block to redirect HTTP → HTTPS.
    # Do NOT hand-add a `listen 443 ssl` block yourself — without the cert files
    # present, `nginx -t` fails and nginx won't start. Let Certbot add it.

    root /var/www/scholarships/current;
    index index.html;

    # ── Security headers ────────────────────────────────────────────────────
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
    # HSTS is added by Certbot's HTTPS block — it is meaningless on plain HTTP.

    # NOTE: if you enable an ad network, its script and frame origins must be
    # allowed in a Content-Security-Policy header or ads are silently blocked.
    # Left out rather than shipped broken — add it once you know your network's
    # domains, on the HTTPS block Certbot creates.
    # add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; script-src 'self' 'unsafe-inline' https://pagead2.googlesyndication.com; frame-src https://googleads.g.doubleclick.net; connect-src 'self'" always;

    # ── Compression ─────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/xml image/svg+xml;

    client_max_body_size 2m;

    # ── API ─────────────────────────────────────────────────────────────────
    location /api/ {
        limit_req zone=api_zone burst=60 nodelay;

        proxy_pass         http://wraith_api;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Cookies carry the paywall grant — they must survive the proxy hop
        proxy_pass_request_headers on;
        proxy_read_timeout 60s;
    }

    # Checkout endpoints: tighter limit, no caching, ever.
    location ~ ^/api/access/(checkout|status|restore) {
        limit_req zone=pay_zone burst=5 nodelay;
        proxy_pass         http://wraith_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
    }

    # Paystack webhook — must reach the API untouched and unbuffered so
    # signature verification sees the exact raw body.
    location /webhooks/ {
        proxy_pass         http://wraith_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
    }

    # Admin API (the SPA's admin routes call this)
    location /admin/ {
        proxy_pass         http://wraith_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /auth/ {
        proxy_pass         http://wraith_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Static assets ───────────────────────────────────────────────────────
    # Vite emits content-hashed filenames, so these can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(png|jpe?g|gif|svg|webp|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    location = /robots.txt {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location = /sitemap.xml {
        proxy_pass http://wraith_api/api/sitemap.xml;
        add_header Cache-Control "public, max-age=3600";
    }

    # ── SPA fallback ────────────────────────────────────────────────────────
    location / {
        # index.html is never cached: it references hashed bundles and changes
        # on every deploy.
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/scholarships.access.log;
    error_log  /var/log/nginx/scholarships.error.log warn;
}
